common:
  execute: true
  group_name: ur_manipulator
  ik_link: tool0
  max_velocity: 0.3
  max_acceleration: 0.3
  print_joints: false

steps:
  - name: home
    target_xyz: [0.0, -0.30, 0.60]
    target_rpy: [1.57, 0.0, 0.0]
    seed_joints: [6.0, -1.0, -2.0, 0.0, 1.0, 3.0]
    sleep_after: 5.0

  - name: pick
    target_xyz: [-0.40, -0.40, 0.20]
    target_rpy: [3.1, 0.0, 0.0]
    seed_joints: [6.0, -1.0, -2.0, 0.0, 1.0, 3.0]
    sleep_after: 0.0
