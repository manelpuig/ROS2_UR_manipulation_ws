common:
  execute: true
  group_name: ur_manipulator
  ik_link: tool0
  max_velocity: 0.3
  max_acceleration: 0.3
  print_joints: false

steps:
  - name: home
    target_xyz: [0.0, -0.2, 0.4]
    target_rpy: [0.0, 1.57, -1.57]      # neutre i estable
    sleep_after: 5.0

  - name: pick
    target_xyz: [-0.3, -0.3, 0.2]    # pujat a 0.2 per robustesa
    target_rpy: [0.0, 3.1416, -1.57]   # eina cap avall
    sleep_after: 0.0
